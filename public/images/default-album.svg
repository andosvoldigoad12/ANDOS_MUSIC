<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9E8"/>
      <stop offset="100%" stop-color="#007F8F"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16272E"/>
      <stop offset="40%" stop-color="#0B1418"/>
      <stop offset="60%" stop-color="#16272E"/>
      <stop offset="85%" stop-color="#0B1418"/>
      <stop offset="100%" stop-color="#101E24"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="16" fill="#101E24"/>
  <rect x="20" y="20" width="360" height="360" rx="12" fill="url(#discGrad)" stroke="#1F363F" stroke-width="2"/>
  <!-- Vinyl Rings -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00D9E8" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#00D9E8" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#00D9E8" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Center Glow -->
  <circle cx="200" cy="200" r="50" fill="url(#cyanGrad)"/>
  <circle cx="200" cy="200" r="14" fill="#0B1418"/>
  <!-- Music Icon -->
  <path d="M195 180 v30 a12 12 0 1 1 -8 -11.5 v-28.5 l26 -6 v26 a12 12 0 1 1 -8 -11.5 v-18 z" fill="#0B1418"/>
  <!-- Badge -->
  <text x="200" y="345" text-anchor="middle" fill="#00D9E8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">ANDOSMUSIC</text>
</svg>

